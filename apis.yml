name: Cruise Technologies
description: 'Cruise Technologies was a wireless thin-client computing company founded in 1997 and based
  in Arlington Heights, Illinois. It developed the CruiseConnect platform, which enabled server-class and
  wireless thin-client computing delivered through OEM and licensing partners worldwide. The company raised
  roughly $12M from Battery Ventures and Bessemer Venture Partners, was acquired in 1999, and has since
  ceased operations. It was surfaced as a historical entry on the Battery Ventures list-of-all-companies
  roster and added to the API Evangelist network as a portfolio lead. Enrichment confirmed the company
  is defunct: it has no live website, no developer portal, no documentation, and no API surface of any
  kind. The former cruisetechnologies.com domain is a parked HugeDomains for-sale listing, not a company
  property. This profile is retained as a historical record only and requires no further enrichment.'
